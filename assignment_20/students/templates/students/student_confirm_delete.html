{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg">
  <div class="frame border-danger">
    <div class="p-6">
      <h1 class="font-display text-xl font-semibold text-fg">Delete this student?</h1>
      <p class="mt-3 text-sm text-fg">You are about to delete <span class="font-medium">{{ student.full_name }}</span> (<span class="font-mono text-[13px]">{{ student.matric_no }}</span>). This also removes their guardians and course enrollments. This cannot be undone.</p>
      <div class="mt-6 flex justify-end gap-3">
        <a href="{% url 'students:detail' student.pk %}" class="button-secondary">Cancel</a>
        <form method="post">{% csrf_token %}<button type="submit" class="button-danger">Delete student</button></form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
