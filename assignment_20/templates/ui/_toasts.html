<div class="fixed right-4 top-4 z-50 flex w-80 max-w-[calc(100%-2rem)] flex-col gap-3" aria-live="polite">
{% for message in messages %}
  <div data-toast role="status" class="motion-safe:toast-enter relative flex items-start gap-3 border bg-surface p-4 text-sm {% if message.tags == 'error' %}border-danger{% elif message.tags == 'warning' %}border-line-strong{% else %}border-line{% endif %}">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i><i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    <span class="mt-1 h-2 w-2 shrink-0 {% if message.tags == 'error' %}bg-danger{% elif message.tags == 'warning' %}bg-fg{% else %}bg-accent-ink{% endif %}" aria-hidden="true"></span>
    <p class="flex-1">{{ message }}</p><button type="button" data-dismiss-toast class="button-icon -my-2 -mr-2" aria-label="Dismiss notification" title="Dismiss notification"><i class="ti ti-x" aria-hidden="true"></i></button>
  </div>
{% endfor %}
</div>
