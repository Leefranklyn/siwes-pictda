{% load ui %}
{% if person.photo and photo_uploads %}
  <img src="{{ person.photo.url }}" alt="{{ person.full_name }}" class="shrink-0 border border-line object-cover {% if size == 'large' %}h-20 w-20{% elif size == 'preview' %}h-16 w-16{% else %}h-10 w-10{% endif %}">
{% else %}
  <span aria-hidden="true" class="grid shrink-0 place-items-center border border-line bg-surface-2 font-mono font-medium text-fg {% if size == 'large' %}h-20 w-20 text-xl{% elif size == 'preview' %}h-16 w-16 text-lg{% else %}h-10 w-10 text-[13px]{% endif %}">{{ person|initials }}</span>
{% endif %}
