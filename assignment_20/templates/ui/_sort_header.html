{% load ui %}{% query_string request sort=next_sort page=None as query %}
<th scope="col" class="{{ css }}"><a href="?{{ query }}" hx-get="?{{ query }}" hx-target="#results" hx-push-url="true" hx-indicator="#loading-bar" class="inline-flex items-center gap-2 py-1 hover:text-fg {% if active %}text-fg{% endif %}">{{ label }}<i class="ti {% if active %}{{ icon }} text-accent-ink{% else %}ti-selector text-faint{% endif %}" aria-hidden="true"></i></a></th>
