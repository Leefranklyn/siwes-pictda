<div class="rounded-xl border border-dashed border-ink-600 px-6 py-14 text-center">
  <i class="ti {{ icon }} text-3xl text-ink-600" aria-hidden="true"></i>
  <h3 class="mt-3 font-display text-lg font-semibold text-ink-50">{{ title }}</h3>
  <p class="mx-auto mt-1 max-w-sm text-sm text-ink-400">{{ body }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="mt-5 button-primary">{{ action_label }}</a>{% endif %}
</div>
