<div class="grid place-items-center border border-dashed border-line-strong px-6 py-14 text-center">
  <i class="ti {{ icon }} text-3xl text-faint" aria-hidden="true"></i>
  <h3 class="meta mt-3 !text-fg">{{ title }}</h3>
  <p class="mx-auto mt-1 max-w-sm text-sm text-mute">{{ body }}</p>
  {% if action_url %}<a href="{{ action_url }}" class="mt-5 button-primary">{{ action_label }}</a>{% endif %}
</div>
