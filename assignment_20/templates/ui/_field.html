<div class="space-y-1.5">
  <label for="{{ field.id_for_label }}" class="field-label block">{{ field.label }}{% if field.field.required %}<span class="text-accent-ink"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="text-xs text-mute">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error" role="alert">{% for error in field.errors %}<p class="flex items-center gap-1.5 text-xs text-danger"><i class="ti ti-alert-circle" aria-hidden="true"></i>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
